name: CI

# Phase 2 baseline: lint, type-check, tests and a real Windows run.
# The product targets Windows, so every push is also exercised on windows-latest
# with the genuine Qt/Windows stack (the print and DPI paths can only be trusted
# there). Linux runs headless/offscreen, which is enough for geometry, layout
# audit, money, database and Unicode assertions.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff (pinned)
        run: pip install ruff==0.16.9
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "mypy==2.3.1" "PySide6-Essentials==6.11.2"
      - name: mypy
        run: mypy src/dentiva

  tests-linux:
    name: pytest (Linux, offscreen)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries for Qt offscreen rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            fonts-dejavu-core
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: pytest
        run: pytest -q --cov=dentiva --cov-report=term-missing
      - name: Headless self-test
        run: python -m dentiva.main --selftest
      - name: Layout audit (5 resolutions)
        run: python -m dentiva.main --audit-layout
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: .coverage
          if-no-files-found: ignore

  tests-windows:
    name: pytest (Windows, genuine Qt stack)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: pytest
        run: pytest -q
      - name: Headless self-test
        run: python -m dentiva.main --selftest
      - name: Layout audit (5 resolutions, 200% scaling)
        run: |
          python -m dentiva.main --audit-layout
          python -m dentiva.main --audit-layout --scale 2.0

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No TODO/FIXME/XXX left in the source tree
        run: |
          if grep -rInE "(TODO|FIXME|XXX)\b" src tests; then
            echo "Unresolved markers found in the source tree (REQ-GEN-010)." >&2
            exit 1
          fi
          echo "no unresolved markers"
      - name: No unresolved merge conflict markers
        run: |
          if grep -rInE "^(<<<<<<<|>>>>>>>)" src tests docs; then
            echo "merge conflict markers present" >&2
            exit 1
          fi
      - name: No obvious secrets in the source tree
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          forbidden = ("1516591935015165",)
          offenders = [
              str(path)
              for path in Path("src").rglob("*.py")
              for token in forbidden
              if token in path.read_text(encoding="utf-8")
          ]
          if offenders:
              print("secret material found in:", offenders, file=sys.stderr)
              raise SystemExit(1)
          print("no plaintext secrets")
          PY

  dead-code:
    name: vulture (unused code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: vulture
        run: vulture src tests --min-confidence 80
